name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1, busted and luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install busted
          sudo luarocks --lua-version=5.1 install luacheck
      - run: busted
      - run: luacheck .

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and install with Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build.ps1 install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\KanbanEasy\KanbanEasy.exe'
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'KanbanEasy.lnk'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          if (-not (Test-Path $lnk)) { throw "missing $lnk" }
          if (-not (Test-Path dist\KanbanEasy-windows.zip)) { throw 'missing zip' }

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: KanbanEasy
          path: dist/*
      # Pushing a v* tag releases under that tag.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      # Every push to main publishes a new release tagged v1.0.<run number>.
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: KanbanEasy v1.0.${{ github.run_number }}
          files: dist/*
          generate_release_notes: true
